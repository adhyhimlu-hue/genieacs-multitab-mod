<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Asisten Suara AI - ALIJAYA NET</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300f2fe'><path d='M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z'/><path d='M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z'/></svg>">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 26, 43, 0.78);
      --border: rgba(0, 242, 254, 0.18);
      --primary: #00f2fe;
      --secondary: #4facfe;
      --accent: #8a2be2;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --ai-bubble: rgba(30, 41, 59, 0.9);
      --user-bubble: linear-gradient(135deg, rgba(0, 114, 255, 0.85), rgba(0, 242, 254, 0.85));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #111e38 0%, var(--bg) 80%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Header */
    header {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--secondary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.35);
    }

    .brand-icon svg {
      width: 22px;
      height: 22px;
      fill: #fff;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #fff, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .voice-select {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      outline: none;
      cursor: pointer;
    }

    .voice-select option {
      background: #0f172a;
      color: #fff;
    }

    .btn-nav {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.82rem;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s;
    }

    .btn-nav:hover {
      color: #fff;
      border-color: var(--primary);
    }

    /* Container */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 14px;
      gap: 14px;
    }

    /* Hero Orb Visualizer */
    .visualizer-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(16px);
    }

    .mode-pills {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      background: rgba(0, 0, 0, 0.25);
      padding: 4px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .mode-pill {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-pill.active {
      background: linear-gradient(135deg, rgba(0, 198, 255, 0.25), rgba(0, 114, 255, 0.4));
      color: #fff;
      border: 1px solid var(--primary);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
    }

    .orb-wrapper {
      position: relative;
      width: 124px;
      height: 124px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .orb-pulse {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.35) 0%, rgba(138, 43, 226, 0.1) 70%, transparent 100%);
      transform: scale(1);
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0.3;
      pointer-events: none;
    }

    .orb-pulse.listening {
      animation: pulseAnim 1.6s infinite ease-in-out;
      opacity: 0.9;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.6) 0%, rgba(79, 172, 254, 0.35) 60%, transparent 100%);
    }

    .orb-pulse.speaking {
      animation: speakAnim 1.1s infinite ease-in-out;
      opacity: 0.95;
      background: radial-gradient(circle, rgba(138, 43, 226, 0.75) 0%, rgba(0, 242, 254, 0.4) 60%, transparent 100%);
    }

    @keyframes pulseAnim {
      0% { transform: scale(0.9); opacity: 0.4; }
      50% { transform: scale(1.35); opacity: 0.9; }
      100% { transform: scale(0.9); opacity: 0.4; }
    }

    @keyframes speakAnim {
      0% { transform: scale(0.95); opacity: 0.55; }
      25% { transform: scale(1.4); opacity: 0.95; }
      50% { transform: scale(1.1); opacity: 0.7; }
      75% { transform: scale(1.42); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.55; }
    }

    .main-mic-btn {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      z-index: 5;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      user-select: none;
    }

    .main-mic-btn:hover {
      transform: scale(1.06);
      border-color: var(--primary);
    }

    .main-mic-btn.active {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border-color: #fff;
      box-shadow: 0 0 28px rgba(0, 198, 255, 0.7);
    }

    .main-mic-btn.speaking {
      background: linear-gradient(135deg, #7928ca, #ff0080);
      border-color: #fff;
      box-shadow: 0 0 28px rgba(255, 0, 128, 0.7);
    }

    .main-mic-btn svg {
      width: 36px;
      height: 36px;
      fill: currentColor;
    }

    .status-text {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--primary);
      text-align: center;
      margin-bottom: 4px;
      min-height: 24px;
    }

    .status-hint {
      font-size: 0.76rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* Live Transcript Area */
    .chat-card {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      min-height: 260px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(16px);
      overflow: hidden;
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 10px;
    }

    .chat-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chat-title span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      display: inline-block;
    }

    .btn-clear {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.72rem;
      cursor: pointer;
      padding: 3px 6px;
      border-radius: 4px;
    }

    .btn-clear:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }

    .messages-box {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
      max-height: 360px;
      scroll-behavior: smooth;
    }

    .messages-box::-webkit-scrollbar {
      width: 5px;
    }
    .messages-box::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 86%;
      animation: fadeInMsg 0.22s ease-out;
    }

    @keyframes fadeInMsg {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg.ai {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-bubble {
      padding: 9px 13px;
      border-radius: 15px;
      font-size: 0.88rem;
      line-height: 1.45;
      word-break: break-word;
    }

    .msg.user .msg-bubble {
      background: var(--user-bubble);
      color: #fff;
      border-bottom-right-radius: 3px;
      box-shadow: 0 4px 14px rgba(0, 114, 255, 0.3);
    }

    .msg.ai .msg-bubble {
      background: var(--ai-bubble);
      color: var(--text);
      border-bottom-left-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }

    .msg-time {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-top: 3px;
      padding: 0 4px;
    }

    .typing-dots span {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--primary);
      margin-right: 4px;
      animation: typingAnim 1.4s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingAnim {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.2); }
    }

    /* Chips */
    .chips-box {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0;
      scrollbar-width: none;
    }
    .chips-box::-webkit-scrollbar { display: none; }

    .chip-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 18px;
      font-size: 0.76rem;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip-btn:hover {
      background: rgba(0, 242, 254, 0.15);
      border-color: var(--primary);
      color: #fff;
    }

    /* Footer Controls */
    .controls-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: auto;
    }

    .text-input-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .text-input-wrapper input {
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 11px 40px 11px 14px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
      transition: border 0.2s;
    }

    .text-input-wrapper input:focus {
      border-color: var(--primary);
    }

    .btn-send {
      position: absolute;
      right: 8px;
      background: transparent;
      border: none;
      color: var(--primary);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-send svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .toggle-voice-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 9px 12px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .toggle-voice-btn.active {
      background: rgba(0, 242, 254, 0.15);
      border-color: var(--primary);
      color: var(--primary);
    }
  </style>
</head>
<body>

  <!-- Audio Player untuk Neural TTS -->
  <audio id="ttsAudioPlayer" style="display: none;"></audio>

  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      </div>
      <div>
        <div class="brand-title">ALIJAYA NET AI</div>
        <div class="brand-subtitle">Asisten Suara Natural & TR-069 DevOps</div>
      </div>
    </div>
    <div class="header-actions">
      <select id="voiceSelect" class="voice-select" title="Pilih Suara Karakter AI">
        <option value="id-ID-GadisNeural">👩 Gadis (Wanita)</option>
        <option value="id-ID-ArdiNeural">👨 Ardi (Pria)</option>
      </select>
      <a href="/#!/devices" class="btn-nav">← Dashboard</a>
    </div>
  </header>

  <main>
    <!-- Visualizer & Mic Hero -->
    <div class="visualizer-card">
      <!-- Pilihan Mode Obrolan -->
      <div class="mode-pills">
        <button id="modeAutoBtn" class="mode-pill active" onclick="setMode('auto')">
          ⚡ Hands-free (Anti-Echo)
        </button>
        <button id="modePttBtn" class="mode-pill" onclick="setMode('ptt')">
          🎙️ Tekan & Bicara (Push-to-Talk)
        </button>
      </div>

      <div class="orb-wrapper">
        <div id="orbPulse" class="orb-pulse"></div>
        <button id="micBtn" class="main-mic-btn" title="Klik untuk Mulai / Hentikan Obrolan Suara">
          <svg id="micIcon" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </button>
      </div>
      <div id="statusText" class="status-text">Klik tombol mic untuk mulai obrolan</div>
      <div id="statusHint" class="status-hint">Proteksi Anti-Looping: Mic otomatis mati saat AI bersuara</div>
    </div>

    <!-- Quick Chips -->
    <div class="chips-box">
      <button class="chip-btn" onclick="sendQuickCommand('status server')">📊 Status Server</button>
      <button class="chip-btn" onclick="sendQuickCommand('cek redaman')">⚠️ Cek Redaman</button>
      <button class="chip-btn" onclick="sendQuickCommand('ont baru')">🆕 Modem Belum Setting</button>
      <button class="chip-btn" onclick="sendQuickCommand('siapa kamu?')">🤖 Tanya AI</button>
      <button class="chip-btn" onclick="sendQuickCommand('bantuan')">❓ Menu Bantuan</button>
    </div>

    <!-- Live Transcript Chat -->
    <div class="chat-card">
      <div class="chat-header">
        <div class="chat-title">
          <span></span> Percakapan Suara
        </div>
        <button class="btn-clear" onclick="clearMessages()">Hapus Chat</button>
      </div>

      <div id="messagesBox" class="messages-box">
        <div class="msg ai">
          <div class="msg-bubble">
            👋 Halo! Saya asisten suara AI <b>ALIJAYA NET</b> dengan suara natural manusia. Tekan tombol mic di atas untuk berbicara.
          </div>
          <div class="msg-time">Sekarang</div>
        </div>
      </div>
    </div>

    <!-- Fallback Controls Bar -->
    <div class="controls-bar">
      <button id="toggleAudioBtn" class="toggle-voice-btn active" onclick="toggleAudioOutput()">
        <span id="audioIcon">🔊</span> Suara AI: Aktif
      </button>
      <div class="text-input-wrapper">
        <input type="text" id="textInput" placeholder="Atau ketik pesan di sini..." onkeypress="handleKey(event)">
        <button class="btn-send" onclick="sendTextFromInput()">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </main>

  <script>
    // State Variables
    let currentMode = 'auto'; // 'auto' (Hands-free) atau 'ptt' (Push-to-Talk)
    let isListening = false;
    let isSpeaking = false;
    let audioOutputEnabled = true;
    let recognition = null;
    let restartTimer = null;
    let processingCommand = false;

    const micBtn = document.getElementById('micBtn');
    const orbPulse = document.getElementById('orbPulse');
    const statusText = document.getElementById('statusText');
    const statusHint = document.getElementById('statusHint');
    const messagesBox = document.getElementById('messagesBox');
    const textInput = document.getElementById('textInput');
    const toggleAudioBtn = document.getElementById('toggleAudioBtn');
    const voiceSelect = document.getElementById('voiceSelect');
    const ttsAudioPlayer = document.getElementById('ttsAudioPlayer');
    const modeAutoBtn = document.getElementById('modeAutoBtn');
    const modePttBtn = document.getElementById('modePttBtn');

    function setMode(mode) {
      currentMode = mode;
      modeAutoBtn.classList.toggle('active', mode === 'auto');
      modePttBtn.classList.toggle('active', mode === 'ptt');
      stopListening();
      stopSpeaking();

      if (mode === 'auto') {
        statusText.innerText = "Mode Hands-free Aktif";
        statusHint.innerText = "Klik mic sekali, lalu berbicara santai (Proteksi Anti-Echo aktif)";
      } else {
        statusText.innerText = "Mode Tekan & Bicara (PTT)";
        statusHint.innerText = "Tekan dan tahan mic saat bicara, lepas setelah selesai";
      }
    }

    // Inisialisasi Web Speech API
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function initSpeechRecognition() {
      if (!SpeechRecognition) {
        statusText.innerText = "Browser tidak mendukung Speech Recognition bawaan";
        statusHint.innerText = "Gunakan Google Chrome di Android atau PC untuk hasil terbaik";
        return null;
      }

      const rec = new SpeechRecognition();
      rec.lang = 'id-ID';
      rec.continuous = (currentMode === 'auto');
      rec.interimResults = true;
      rec.maxAlternatives = 1;

      rec.onstart = () => {
        isListening = true;
        updateUIState('listening');
      };

      rec.onresult = (event) => {
        // JANGAN proses apapun jika AI sedang memutar suara atau sedang proses request (ANTI-LOOPING MUTLAK)
        if (isSpeaking || processingCommand) {
          return;
        }

        let interimTranscript = '';
        let finalTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          const item = event.results[i];
          if (item.isFinal) {
            finalTranscript += item[0].transcript;
          } else {
            interimTranscript += item[0].transcript;
          }
        }

        if (interimTranscript) {
          statusText.innerText = `"${interimTranscript}..."`;
        }

        if (finalTranscript.trim()) {
          const cleanCmd = finalTranscript.trim();
          
          // FILTER NOISE & GUMAMAN (Mencegah false triggering)
          if (cleanCmd.length < 3 || isNoiseWord(cleanCmd)) {
            console.log("Ignored noise word:", cleanCmd);
            return;
          }

          statusText.innerText = `Memproses: "${cleanCmd}"`;
          handleUserCommand(cleanCmd);
        }
      };

      rec.onerror = (event) => {
        if (event.error === 'no-speech') return;
        console.warn('SpeechRecognition error:', event.error);
        if (event.error === 'not-allowed') {
          isListening = false;
          updateUIState('idle');
          statusText.innerText = "Izin mikrofon belum diberikan";
          statusHint.innerText = "Klik ikon gembok di URL browser dan izinkan akses mikrofon";
        }
      };

      rec.onend = () => {
        // Hanya restart otomatis jika mode auto, tidak sedang bicara, dan tidak sedang proses command
        if (isListening && currentMode === 'auto' && !isSpeaking && !processingCommand) {
          clearTimeout(restartTimer);
          restartTimer = setTimeout(() => {
            try { if (isListening) rec.start(); } catch (e) {}
          }, 300);
        } else if (!isSpeaking) {
          isListening = false;
          updateUIState('idle');
        }
      };

      return rec;
    }

    recognition = initSpeechRecognition();

    function isNoiseWord(txt) {
      const lower = txt.toLowerCase().trim();
      const noises = ['ee', 'aa', 'uh', 'hmm', 'ah', 'oh', 'ya', 'oke'];
      return noises.includes(lower);
    }

    // Mic Button Handlers (Mendukung Click & Push-to-Talk)
    micBtn.addEventListener('click', (e) => {
      if (currentMode === 'ptt') return; // Handled by pointer events

      // Interupsi: Jika AI sedang bicara, klik mic akan membungkam suara AI seketika
      if (isSpeaking) {
        stopSpeaking();
        startListening();
        return;
      }

      if (isListening) {
        stopListening();
      } else {
        startListening();
      }
    });

    // Push-to-Talk Event Listeners
    micBtn.addEventListener('pointerdown', (e) => {
      if (currentMode !== 'ptt') return;
      if (isSpeaking) stopSpeaking();
      startListening();
    });

    window.addEventListener('pointerup', (e) => {
      if (currentMode !== 'ptt') return;
      if (isListening) {
        setTimeout(() => stopListening(), 350);
      }
    });

    function startListening() {
      // Pastikan audio AI benar-benar berhenti sebelum mic menyala
      stopSpeaking();

      if (!recognition) {
        recognition = initSpeechRecognition();
        if (!recognition) return;
      }

      try {
        isListening = true;
        recognition.start();
      } catch (e) {
        console.log('Recognition start caught:', e);
      }
      updateUIState('listening');
    }

    function stopListening() {
      isListening = false;
      clearTimeout(restartTimer);
      if (recognition) {
        try { recognition.abort(); } catch (e) {}
      }
      if (!isSpeaking) updateUIState('idle');
    }

    function updateUIState(state) {
      orbPulse.className = 'orb-pulse';
      micBtn.className = 'main-mic-btn';

      if (state === 'listening') {
        orbPulse.classList.add('listening');
        micBtn.classList.add('active');
        statusText.innerText = "Mendengarkan... Silakan bicara";
        statusHint.innerText = currentMode === 'auto' ? "Mode Hands-free Aktif (Bicara langsung)" : "Lepas tombol mic untuk mengirim";
      } else if (state === 'thinking') {
        orbPulse.classList.add('listening');
        micBtn.classList.add('active');
        statusText.innerText = "⚡ AI sedang mengecek data...";
        statusHint.innerText = "Tunggu sebentar...";
      } else if (state === 'speaking') {
        orbPulse.classList.add('speaking');
        micBtn.classList.add('speaking');
        statusText.innerText = "🔊 AI sedang menjawab...";
        statusHint.innerText = "Klik tombol mic jika ingin menyela percakapan";
      } else {
        statusText.innerText = "Klik tombol mic untuk mulai obrolan";
        statusHint.innerText = "Proteksi Anti-Looping: Mic otomatis mati saat AI bersuara";
      }
    }

    // Multi-Endpoint Fallback API Executor
    async function executeAgentCommand(text) {
      const endpoints = [
        '/bot-proxy/api/agent_command',
        '/api/agent_command'
      ];

      let lastError = null;
      for (const ep of endpoints) {
        try {
          const res = await fetch(ep, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              text: text,
              isAdmin: true,
              sender: 'voice_web_user'
            })
          });

          if (res.ok) {
            const data = await res.json();
            const reply = data.reply || data.text || (typeof data === 'string' ? data : null);
            if (reply) return reply;
          }
        } catch (e) {
          lastError = e;
          console.warn(`Endpoint ${ep} gagal:`, e);
        }
      }

      throw lastError || new Error('Semua endpoint GenieACS tidak merespon');
    }

    // Handle Perintah Pengguna
    async function handleUserCommand(text) {
      if (!text || !text.trim()) return;

      // KUNCI UTAMA ANTI-LOOPING:
      // Matikan mic seketika saat command mulai diproses agar suara speaker tidak bocor
      processingCommand = true;
      stopListening();

      appendMessage('user', text);
      updateUIState('thinking');

      const loadingId = 'loading_' + Date.now();
      appendLoadingBubble(loadingId);

      try {
        const replyText = await executeAgentCommand(text);
        removeLoadingBubble(loadingId);
        appendMessage('ai', replyText);

        if (audioOutputEnabled) {
          playNeuralAudio(replyText);
        } else {
          processingCommand = false;
          if (currentMode === 'auto') startListening();
          else updateUIState('idle');
        }
      } catch (err) {
        console.error('API Error:', err);
        removeLoadingBubble(loadingId);
        const errMsg = 'Maaf, belum tersambung ke layanan bot GenieACS. Pastikan service bot sedang aktif.';
        appendMessage('ai', errMsg);
        if (audioOutputEnabled) playNeuralAudio(errMsg);
        else {
          processingCommand = false;
          updateUIState('idle');
        }
      }
    }

    // Pemutar Audio Neural Manusia (id-ID-GadisNeural / id-ID-ArdiNeural)
    function playNeuralAudio(rawText) {
      stopSpeaking();

      const selectedVoice = voiceSelect.value || 'id-ID-GadisNeural';
      const ttsUrl = `/api/voice/tts?text=${encodeURIComponent(rawText)}&voice=${encodeURIComponent(selectedVoice)}`;
      const fallbackUrl = `/bot-proxy/api/voice/tts?text=${encodeURIComponent(rawText)}&voice=${encodeURIComponent(selectedVoice)}`;

      isSpeaking = true;
      updateUIState('speaking');

      ttsAudioPlayer.src = ttsUrl;
      ttsAudioPlayer.onerror = () => {
        // Coba fallback URL jika port berbeda
        if (ttsAudioPlayer.src.includes('/api/voice/tts')) {
          ttsAudioPlayer.src = fallbackUrl;
          ttsAudioPlayer.play().catch(fallbackToBrowserTTS);
        } else {
          fallbackToBrowserTTS();
        }
      };

      ttsAudioPlayer.onended = () => {
        isSpeaking = false;
        processingCommand = false;
        // Berikan jeda hening 600ms sebelum mic aktif kembali (PROTEKSI ANTI-LOOPING)
        setTimeout(() => {
          if (currentMode === 'auto') {
            startListening();
          } else {
            updateUIState('idle');
          }
        }, 600);
      };

      ttsAudioPlayer.play().catch(e => {
        console.warn('Audio play blocked/failed, trying fallback:', e);
        fallbackToBrowserTTS(rawText);
      });
    }

    // Fallback jika audio stream offline: browser SpeechSynthesis
    function fallbackToBrowserTTS(rawText) {
      if (!window.speechSynthesis) {
        isSpeaking = false;
        processingCommand = false;
        if (currentMode === 'auto') startListening();
        return;
      }

      const utterance = new SpeechSynthesisUtterance(rawText);
      utterance.lang = 'id-ID';
      utterance.rate = 1.05;

      utterance.onend = () => {
        isSpeaking = false;
        processingCommand = false;
        setTimeout(() => {
          if (currentMode === 'auto') startListening();
          else updateUIState('idle');
        }, 600);
      };

      utterance.onerror = () => {
        isSpeaking = false;
        processingCommand = false;
        if (currentMode === 'auto') startListening();
      };

      window.speechSynthesis.speak(utterance);
    }

    function stopSpeaking() {
      if (ttsAudioPlayer) {
        ttsAudioPlayer.pause();
        ttsAudioPlayer.currentTime = 0;
      }
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
      }
      isSpeaking = false;
    }

    function toggleAudioOutput() {
      audioOutputEnabled = !audioOutputEnabled;
      if (!audioOutputEnabled) {
        stopSpeaking();
        toggleAudioBtn.classList.remove('active');
        toggleAudioBtn.innerHTML = '<span>🔇</span> Suara AI: Nonaktif';
      } else {
        toggleAudioBtn.classList.add('active');
        toggleAudioBtn.innerHTML = '<span>🔊</span> Suara AI: Aktif';
      }
    }

    function sendQuickCommand(cmd) {
      textInput.value = '';
      handleUserCommand(cmd);
    }

    function sendTextFromInput() {
      const text = textInput.value.trim();
      if (!text) return;
      textInput.value = '';
      handleUserCommand(text);
    }

    function handleKey(e) {
      if (e.key === 'Enter') {
        sendTextFromInput();
      }
    }

    function appendMessage(sender, text) {
      const timeStr = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${sender}`;
      
      let formatted = text
        .replace(/\n/g, '<br>')
        .replace(/\*(.*?)\*/g, '<b>$1</b>')
        .replace(/`(.*?)`/g, '<code style="background:rgba(255,255,255,0.1);padding:2px 5px;border-radius:4px;font-size:0.85em;">$1</code>');

      msgDiv.innerHTML = `
        <div class="msg-bubble">${formatted}</div>
        <div class="msg-time">${timeStr}</div>
      `;
      messagesBox.appendChild(msgDiv);
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    function appendLoadingBubble(id) {
      const msgDiv = document.createElement('div');
      msgDiv.id = id;
      msgDiv.className = 'msg ai';
      msgDiv.innerHTML = `
        <div class="msg-bubble typing-dots">
          <span></span><span></span><span></span>
        </div>
      `;
      messagesBox.appendChild(msgDiv);
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    function removeLoadingBubble(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function clearMessages() {
      messagesBox.innerHTML = '';
    }
  </script>
</body>
</html>
